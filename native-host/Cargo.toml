[package]
name = "copyit-native-host"
version = "0.1.0"
edition = "2021"
description = "Chromium native messaging host for the CopyIt browser extension"

[[bin]]
name = "copyit-native-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
zeroize = "1"
rand = "0.8"
fs2 = "0.4"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
