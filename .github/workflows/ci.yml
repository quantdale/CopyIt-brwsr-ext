name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path native-host/Cargo.toml
      - run: cargo clippy --manifest-path native-host/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path native-host/Cargo.toml -- --check
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx eslint . --ext .ts
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: quantdale/CopyIt, path: CopyIt, ref: feature/sqlite-browser-extension-compat }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path CopyIt/Cargo.toml
      - run: cargo clippy --manifest-path CopyIt/Cargo.toml --all-targets -- -D warnings
