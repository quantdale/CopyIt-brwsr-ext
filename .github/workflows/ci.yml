name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master pinned 2026-08-28
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - run: cargo test --manifest-path native-host/Cargo.toml
      - run: cargo clippy --manifest-path native-host/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path native-host/Cargo.toml -- --check
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { repository: quantdale/CopyIt, path: CopyIt, ref: c36e138ce7a6153906347699384ec901369fc5b8 } # coordinated SQLite contract commit
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master pinned 2026-08-28
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - run: cargo test --manifest-path CopyIt/Cargo.toml
      - run: cargo clippy --manifest-path CopyIt/Cargo.toml --all-targets -- -D warnings
  e2e:
    runs-on: windows-latest
    # The E2E suite is a release gate: it builds first, then loads the real
    # built popup bundle and FAILS (never silently skips) if the artifact is
    # missing, so it cannot report green on a stale/absent build.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .node-version, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run e2e
