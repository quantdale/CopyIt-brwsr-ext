name: Windows Integration
on:
  workflow_dispatch: {}
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  integration:
    runs-on: windows-latest
    # build.ps1 performs the release host build, npm ci, extension build and
    # tsc once each; the dedicated runs below then exercise install-tooling
    # behavior and the full native integration suite without duplicating work.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-native-integration.ps1
